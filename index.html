<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Face Liveness</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0c0c0f;
      font-family: system-ui, -apple-system, sans-serif;
      color: #fff;
      padding: 24px 0 32px;
    }

    .scene {
      position: relative;
      width: min(100vw, 420px);
      aspect-ratio: 3/4;
    }

    #video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 24px;
      transform: scaleX(-1);
    }

    #overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border-radius: 24px;
    }

    .hud {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 0 24px 28px;
      pointer-events: none;
    }

    .dots {
      display: flex;
      gap: 6px;
      justify-content: center;
      margin-bottom: 20px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 99px;
      background: rgba(255,255,255,.25);
      transition: background .3s, width .3s;
    }

    .dot.done   { background: #22c55e; }
    .dot.active { background: #fff; width: 20px; }

    .label {
      text-align: center;
      font-size: 1.15rem;
      font-weight: 700;
      text-shadow: 0 2px 10px rgba(0,0,0,.7);
      min-height: 30px;
      transition: opacity .2s;
    }

    .sublabel {
      text-align: center;
      font-size: .8rem;
      color: rgba(255,255,255,.6);
      margin-top: 5px;
      text-shadow: 0 1px 6px rgba(0,0,0,.8);
      min-height: 18px;
    }

    #gate {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: rgba(0,0,0,.7);
      border-radius: 24px;
      cursor: pointer;
      transition: opacity .4s;
    }

    #gate .tap  { font-size: 1rem; font-weight: 600; }
    #gate .fine { font-size: .75rem; color: rgba(255,255,255,.5); max-width: 220px; text-align: center; line-height: 1.6; }

    #gate.hidden { opacity: 0; pointer-events: none; }

    #retryBtn {
      margin-top: 16px;
      padding: 12px 36px;
      border: none;
      border-radius: 99px;
      background: rgba(255,255,255,.12);
      color: #fff;
      font: inherit;
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
      display: none;
      white-space: nowrap;
    }

    #retryBtn:hover { background: rgba(255,255,255,.22); }
  </style>
</head>
<body>
  <div class="scene">
    <video id="video" autoplay muted playsinline></video>
    <canvas id="overlay"></canvas>

    <div class="hud">
      <div class="dots" id="dots"></div>
      <div class="label" id="label">Position your face in the oval</div>
      <div class="sublabel" id="sublabel"></div>
    </div>

    <div id="gate">
      <div class="tap">Tap to begin</div>
      <div class="fine">Your camera is only used locally. No data leaves your device.</div>
    </div>
  </div>

  <button id="retryBtn">Try again</button>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
